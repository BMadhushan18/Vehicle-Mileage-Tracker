# Cloudflare Pages project config (used by `wrangler pages dev` and Pages builds)
name = "ridelog"
pages_build_output_dir = "./dist"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "ridelog-db"
# Replace with the id printed by: npx wrangler d1 create ridelog-db
database_id = "8af4fed3-46f9-423e-b3db-76e9c3e38847"
migrations_dir = "migrations"
