# Builds the RideLog Android app (Capacitor) in the cloud and publishes the APK
# as a GitHub Release. Download on your phone from:
#   https://github.com/<owner>/<repo>/releases/latest/download/RideLog.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.env.android'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web bundle and copy into Android project
        run: npm run build:android

      # Optional: a stable signing key stored as repo secrets, so updates install over the old app.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.RIDELOG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ridelog.keystore"
            echo "RIDELOG_KEYSTORE_PATH=$RUNNER_TEMP/ridelog.keystore" >> "$GITHUB_ENV"
            echo "Using stable signing key."
          else
            echo "No signing key secret: using a temporary debug key (uninstall the old app before installing)."
          fi

      - name: Build APK
        working-directory: android
        env:
          RIDELOG_KEYSTORE_PASSWORD: ${{ secrets.RIDELOG_KEYSTORE_PASSWORD }}
          RIDELOG_KEY_ALIAS: ${{ secrets.RIDELOG_KEY_ALIAS }}
          RIDELOG_KEY_PASSWORD: ${{ secrets.RIDELOG_KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x gradlew
          # Gradle downloads itself on first run; retry if its servers are briefly unavailable.
          for attempt in 1 2 3 4; do
            if ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; [ "${PIPESTATUS[0]}" = 0 ]; then break; fi
            # Surface the real error as public annotations (full logs need a GitHub login).
            { grep -A14 -E "What went wrong|^\* Where" "$RUNNER_TEMP/gradle.log"; grep -E "Caused by|Exception:" "$RUNNER_TEMP/gradle.log" | head -12; } | grep -v "^\s*at \|^--$" | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            # Only a failed Gradle download is worth retrying; real build errors stop here.
            if ! grep -q "Could not install Gradle" "$RUNNER_TEMP/gradle.log" || [ "$attempt" = 4 ]; then exit 1; fi
            echo "Gradle download failed (attempt $attempt), retrying in $((attempt * 60))s..."
            sleep $((attempt * 60))
          done
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RideLog.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RideLog-apk-${{ github.run_number }}
          path: RideLog.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.${{ github.run_number }}
          name: RideLog Android 1.${{ github.run_number }}
          make_latest: true
          files: RideLog.apk
          body: |
            RideLog Android app, built from ${{ github.sha }}.
            Install: open this page on your phone, download **RideLog.apk**, allow "Install unknown apps" for your browser.
